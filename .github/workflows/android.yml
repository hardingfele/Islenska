name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04  # image ships with the Android SDK
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # New or changed course text gets audio here (Hugging Face isn't reachable from where the content is edited).
      # Only missing clips are synthesized; the result is committed back with [skip ci] so the repo stays complete.
      - name: Fill in missing audio
        run: |
          python tools/add_audio.py --check | tee /tmp/audio.txt
          if grep -qE "^(normal|_slow): [1-9]" /tmp/audio.txt; then
            pip install piper-tts
            # Hekla needs ffmpeg's rubberband filter; Ubuntu's own ffmpeg has it
            if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q " rubberband "; then
              sudo apt-get update && sudo apt-get install -y ffmpeg
              export FFMPEG=/usr/bin/ffmpeg
            fi
            mkdir -p voices
            for v in salka ugla bui steinn; do
              for f in onnx onnx.json; do
                curl -fsSL -o "voices/is_IS-$v-medium.$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/is/is_IS/$v/medium/is_IS-$v-medium.$f"
              done
            done
            python tools/add_audio.py --voices voices
            python tools/add_audio.py --check
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add web/audio web/content
            git commit -m "Add audio for new course text [skip ci]" && git push
          fi

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          # microphone for pronunciation practice
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          # Android 11+: let the app find the system speech recognizer (Google)
          grep -q "android.speech.RecognitionService" $M || sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' $M
          grep -n "permission\|RecognitionService" $M
          npx cap sync android

      - name: Set version from build number
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -nE "versionCode|versionName" $G

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign with the permanent key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks signing/islenska-release.jks --ks-key-alias islenska \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Islenska.apk aligned.apk
          "$BT/apksigner" verify --print-certs Islenska.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Islenska-apk
          path: Islenska.apk

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Íslenska (latest build)
          body: |
            Version 1.0.${{ github.run_number }}, signed with the app's permanent key (built from ${{ github.sha }}).
            Installs over earlier versions from 1.0.${{ github.run_number }} on. Your progress is kept.
            On your Android phone: download Islenska.apk, open it, and allow "install unknown apps" for your browser when asked.
          files: Islenska.apk
          prerelease: true
          make_latest: true
